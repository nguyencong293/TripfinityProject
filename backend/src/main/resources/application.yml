app:
  jwt:
    secret: oB1VRpuC57rPPWlODQH02IHBGrqWRRQusCJ3zEOcXSvcsSM8lUmVApItEpurp3feDbrhmRjZZvFbFQxwWH9gAg==
    expiration: 86400

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

logging:
  level:
    '[com.company.student_backend]': ${LOG_LEVEL:DEBUG}
    '[org.springframework.web]': ${LOG_LEVEL_WEB:DEBUG}
    '[org.springframework.security]': ${LOG_LEVEL_SECURITY:WARN}
    '[org.hibernate.SQL]': ${LOG_LEVEL_SQL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
  prometheus:
    metrics:
      export:
        enabled: true

