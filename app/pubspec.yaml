name: app
description: "Tripfinity Flutter Application"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.2
  json_annotation: ^4.9.0
  dio: ^5.0.0
  google_sign_in: ^6.1.6
  package_info_plus: ^8.3.0
  fluttertoast: ^8.2.4

  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: any
  json_serializable: any


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/lang/
    - assets/images/

  fonts:
    - family: Fz Poppin
      fonts:
        - asset: assets/fonts/FZPoppins-Regular.ttf
        - asset: assets/fonts/FZPoppins-Bold.ttf
        - asset: assets/fonts/FZPoppins-SemiBold.ttf
        - asset: assets/fonts/FZPoppins-Medium.ttf

