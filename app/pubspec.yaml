name: app
description: "Tripfinity Flutter Application"

publish_to: "none" # Remove this line if you wish to publish to pub.dev 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.2
  json_annotation: ^4.9.0
  dio: ^5.0.0
  google_sign_in: ^6.1.6
  package_info_plus: ^8.3.0
  fluttertoast: ^8.2.4
  lucide_icons: ^0.257.0
  share_plus: ^7.2.1
  image_picker: ^1.0.4
  url_launcher: ^6.0.20
  http: ^1.1.0
  flutter_markdown: ^0.6.18
  webview_flutter: ^4.10.0

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: any
  json_serializable: any
  flutter_launcher_icons: ^0.13.1

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/lang/
    - assets/images/

  fonts:
    - family: Fz Poppin
      fonts:
        - asset: assets/fonts/FZPoppins-Regular.ttf
        - asset: assets/fonts/FZPoppins-Bold.ttf
        - asset: assets/fonts/FZPoppins-SemiBold.ttf
        - asset: assets/fonts/FZPoppins-Medium.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

  adaptive_icon_foreground: null
  adaptive_icon_background: "#FFFFFF"

  remove_alpha_ios: false
