name: app
description: "Tripfinity Flutter Application"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/lang/

  fonts:
    - family: Fz Poppin
      fonts:
        - asset: assets/fonts/FZ Poppins-Regular.ttf
        - asset: assets/fonts/FZ Poppins-Bold.ttf
        - asset: assets/fonts/FZ Poppins-SemiBold.ttf
        - asset: assets/fonts/FZ Poppins-Medium.ttf

