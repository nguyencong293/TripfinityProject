name: Build iOS Simulator App

on:
  workflow_dispatch:  # Chạy thủ công
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    # Sử dụng macos-latest (Hiện tại là chip M1/Apple Silicon)
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Build iOS Simulator App (Force x86_64)
      working-directory: ./app
      run: |
        # SỬA LỖI Ở ĐÂY:
        # Thay vì dùng --arch (sai), ta dùng --xcargs để cấu hình Xcode.
        # "ONLY_ACTIVE_ARCH=NO": Yêu cầu build đầy đủ, không chỉ cho máy đang chạy.
        # "ARCHS=x86_64": Chỉ định rõ ràng là build cho chip Intel.
        
        flutter build ios --debug --simulator --no-codesign --xcargs "ONLY_ACTIVE_ARCH=NO ARCHS=x86_64"
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        # Xóa zip cũ nếu có
        rm -f Runner.zip
        
        # Dùng lệnh zip chuẩn để Appetize nhận diện đúng cấu trúc
        # -r: Nén thư mục
        # -y: Giữ nguyên liên kết hệ thống (quan trọng cho Mac App)
        zip -r -y Runner.zip Runner.app
        
        # Kiểm tra cấu trúc file zip (Dòng đầu tiên phải là Runner.app/)
        echo "=== Checking ZIP Structure ==="
        unzip -l Runner.zip | head -n 5
    
    - name: Upload iOS Simulator App
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5