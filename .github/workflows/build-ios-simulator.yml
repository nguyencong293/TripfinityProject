name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode 16
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
        swift --version
    
    - name: Install iOS Simulator Runtime
      run: |
        # Install iOS 18 Simulator runtime
        xcodebuild -downloadPlatform iOS
        
        # List available simulators
        xcrun simctl list devices available | grep -i iphone | head -5
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Flutter version
      run: flutter --version
    
    - name: Get dependencies
      working-directory: ./app
      run: |
        flutter clean
        flutter pub get
    
    - name: Install CocoaPods
      working-directory: ./app/ios
      run: |
        rm -rf Pods Podfile.lock
        pod install --repo-update
    
    - name: Build iOS Simulator
      working-directory: ./app
      run: |
        flutter build ios --debug --simulator --no-codesign
        ls -la build/ios/iphonesimulator/Runner.app || exit 1
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        rm -f Runner.zip
        ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.zip
        unzip -l Runner.zip | head -10
        ls -lh Runner.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5