name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode 16.2
      run: |
        # macos-14 có Xcode 16.2 với iOS Simulator 18.2 pre-installed
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        xcodebuild -version
        swift --version
        xcrun simctl list devices available | grep -i "iphone" | head -3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Flutter version
      run: flutter --version
    
    - name: Get dependencies
      working-directory: ./app
      run: |
        flutter clean
        flutter pub get
    
    - name: Install CocoaPods
      working-directory: ./app/ios
      run: |
        rm -rf Pods Podfile.lock
        pod install --repo-update
    
    - name: Build iOS Simulator
      working-directory: ./app
      run: |
        flutter build ios --debug --simulator --no-codesign
        ls -la build/ios/iphonesimulator/Runner.app || exit 1
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        rm -f Runner.zip
        ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.zip
        unzip -l Runner.zip | head -10
        ls -lh Runner.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5