name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode 16.2
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        xcodebuild -version
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./app
      run: |
        flutter clean
        flutter pub get
    
    - name: Install CocoaPods
      working-directory: ./app/ios
      run: |
        rm -rf Pods Podfile.lock
        pod install --repo-update
    
    - name: Build iOS Simulator with x86_64 for Appetize
      working-directory: ./app
      run: |
        # Appetize YÊU CẦU x86_64 architecture
        # Dùng xcodebuild trực tiếp với ARCHS=x86_64
        
        # Bước 1: Flutter build để generate code
        flutter build ios --debug --simulator --no-codesign || true
        
        # Bước 2: Build bằng xcodebuild với x86_64
        cd ios
        xcodebuild \
          -workspace Runner.xcworkspace \
          -scheme Runner \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          ARCHS=x86_64 \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=../build/ios \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | xcbeautify || true
        
        # Bước 3: Kiểm tra output
        echo "=== Checking build output ==="
        find ../build -name "*.app" -type d 2>/dev/null || echo "No .app found in build"
        
        # Copy .app to expected location
        if [ -d "../build/ios/Debug-iphonesimulator/Runner.app" ]; then
          mkdir -p ../build/ios/iphonesimulator
          cp -R ../build/ios/Debug-iphonesimulator/Runner.app ../build/ios/iphonesimulator/
        fi
        
        ls -la ../build/ios/iphonesimulator/Runner.app || exit 1
        
        # Verify architecture - PHẢI là x86_64
        echo "=== Architecture Check ==="
        file ../build/ios/iphonesimulator/Runner.app/Runner
        lipo -info ../build/ios/iphonesimulator/Runner.app/Runner
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        rm -f Runner.zip
        
        # TẠO ZIP ĐÚNG CHUẨN APPETIZE
        # Cấu trúc: Runner.zip chứa Runner.app/ ở root
        zip -r -y Runner.zip Runner.app
        
        echo "=== ZIP Structure ==="
        unzip -l Runner.zip | head -15
        
        echo "=== ZIP Size ==="
        ls -lh Runner.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5