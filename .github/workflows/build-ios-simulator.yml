name: Build iOS Simulator App

on:
  workflow_dispatch:  # Chạy thủ công từ GitHub
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'master'
        cache: false
    
    - name: Check Flutter version
      run: |
        flutter --version
        dart --version
    
    - name: Get dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Build iOS Simulator App
      working-directory: ./app
      run: |
        # Build debug for iOS Simulator
        flutter build ios --debug --simulator --no-codesign
        
        # Verify the .app was created
        echo "=== Build Output ==="
        ls -la build/ios/iphonesimulator/
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        # Appetize requires zip containing .app directly (not nested in folders)
        zip -r -y TripFinity-iOS.zip Runner.app
        
        # Verify the zip structure
        echo "=== ZIP Contents ==="
        unzip -l TripFinity-iOS.zip | head -20
    
    - name: Upload iOS Simulator App
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/TripFinity-iOS.zip
        retention-days: 7
