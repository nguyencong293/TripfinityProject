name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode 16.2
      run: |
        sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
        xcodebuild -version
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./app
      run: |
        flutter clean
        flutter pub get
    
    - name: Install CocoaPods
      working-directory: ./app/ios
      run: |
        rm -rf Pods Podfile.lock
        
        # Install xcodeproj gem để thêm file vào project
        gem install xcodeproj
        
        pod install --repo-update
    
    - name: Add GoogleService-Info.plist to Xcode project
      working-directory: ./app/ios
      run: |
        # Kiểm tra file tồn tại
        if [ ! -f "Runner/GoogleService-Info.plist" ]; then
          echo "ERROR: GoogleService-Info.plist not found!"
          exit 1
        fi
        
        # Thêm file vào Copy Bundle Resources trong project.pbxproj
        # Dùng PlistBuddy hoặc sed để add file reference
        ruby <<'RUBY'
        require 'xcodeproj'
        
        project_path = 'Runner.xcodeproj'
        project = Xcodeproj::Project.open(project_path)
        
        # Find main target
        target = project.targets.find { |t| t.name == 'Runner' }
        
        # Check if GoogleService-Info.plist already exists
        existing = target.resources_build_phase.files.find { |f| 
          f.file_ref&.path&.include?('GoogleService-Info.plist') 
        }
        
        unless existing
          # Find or create file reference
          group = project.main_group.find_subpath('Runner', true)
          file_ref = group.files.find { |f| f.path == 'GoogleService-Info.plist' }
          
          unless file_ref
            file_ref = group.new_file('GoogleService-Info.plist')
          end
          
          # Add to Copy Bundle Resources
          target.resources_build_phase.add_file_reference(file_ref)
          
          project.save
          puts "✅ Added GoogleService-Info.plist to Xcode project"
        else
          puts "✓ GoogleService-Info.plist already in project"
        end
        RUBY
    
    - name: Build iOS Simulator with x86_64 for Appetize
      working-directory: ./app
      run: |
        # Appetize YÊU CẦU x86_64 architecture
        # Dùng xcodebuild trực tiếp với ARCHS=x86_64
        
        # Bước 1: Flutter build để generate code
        flutter build ios --debug --simulator --no-codesign || true
        
        # Bước 2: Build bằng xcodebuild với x86_64
        cd ios
        xcodebuild \
          -workspace Runner.xcworkspace \
          -scheme Runner \
          -sdk iphonesimulator \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          ARCHS=x86_64 \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=../build/ios \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          | xcbeautify || true
        
        # Bước 3: Kiểm tra output
        echo "=== Checking build output ==="
        find ../build -name "*.app" -type d 2>/dev/null || echo "No .app found in build"
        
        # Copy .app to expected location
        if [ -d "../build/ios/Debug-iphonesimulator/Runner.app" ]; then
          mkdir -p ../build/ios/iphonesimulator
          cp -R ../build/ios/Debug-iphonesimulator/Runner.app ../build/ios/iphonesimulator/
        fi
        
        ls -la ../build/ios/iphonesimulator/Runner.app || exit 1
        
        # Verify architecture - PHẢI là x86_64
        echo "=== Architecture Check ==="
        file ../build/ios/iphonesimulator/Runner.app/Runner
        lipo -info ../build/ios/iphonesimulator/Runner.app/Runner
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        # TẠO ZIP ĐÚNG CHUẨN APPETIZE
        # Cấu trúc: Runner.zip chứa Runner.app/ ở root
        zip -r -y Runner.zip Runner.app
        
        echo "=== ZIP Structure ==="
        unzip -l Runner.zip | head -15
        
        echo "=== ZIP Size ==="
        ls -lh Runner.zip
        
        # QUAN TRỌNG: Di chuyển ra thư mục riêng để tránh zip lồng zip
        mkdir -p ../../appetize-output
        mv Runner.zip ../../appetize-output/
    
    - name: Upload Artifact for Appetize
      uses: actions/upload-artifact@v4
      with:
        name: TripFinity-iOS-Simulator
        # Upload file zip trực tiếp, không qua thư mục
        path: app/build/appetize-output/Runner.zip
        compression-level: 0
        retention-days: 5