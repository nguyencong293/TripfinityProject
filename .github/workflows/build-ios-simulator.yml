name: Build iOS Simulator App

on:
  workflow_dispatch:  # Chạy thủ công từ GitHub
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'master'
        cache: false
    
    - name: Check Flutter version
      run: |
        flutter --version
        dart --version
    
    - name: Get dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Build iOS Simulator App
      working-directory: ./app
      run: |
        flutter build ios --debug --simulator --no-codesign
    
    - name: Create ZIP for Appetize
      working-directory: ./app
      run: |
        cd build/ios/iphonesimulator
        zip -r TripFinity-iOS.zip Runner.app
    
    - name: Upload iOS Simulator App
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/TripFinity-iOS.zip
        retention-days: 7
