name: Build iOS Simulator App

on:
  workflow_dispatch:  # Chạy thủ công từ GitHub
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    # macos-latest miễn phí (Apple Silicon)
    # App sẽ chạy qua Rosetta trên Intel Mac
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'master'
        cache: false
    
    - name: Check Flutter version
      run: |
        flutter --version
        dart --version
    
    - name: Get dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Build iOS Simulator App
      working-directory: ./app
      run: |
        # Build debug for iOS Simulator
        flutter build ios --debug --simulator --no-codesign
        
        # Verify the .app was created
        echo "=== Build Output ==="
        ls -la build/ios/iphonesimulator/
        
        # Show .app contents
        echo "=== Runner.app Contents ==="
        ls -la build/ios/iphonesimulator/Runner.app/
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        # Remove old zip if exists
        rm -f Runner.zip
        
        # Create zip with correct structure for Appetize
        # Appetize needs the .app bundle directly in the zip root
        ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.zip
        
        # Verify zip contents
        echo "=== ZIP Contents ==="
        unzip -l Runner.zip
        
        # Show zip size
        echo "=== ZIP Size ==="
        ls -lh Runner.zip
    
    - name: Upload iOS Simulator App
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 7
