name: Build iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      run: |
        # Select Xcode 15.4
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./app
      run: |
        flutter clean
        flutter pub get
    
    - name: Prepare iOS build
      working-directory: ./app/ios
      run: |
        # Clean pods completely
        rm -rf Pods Podfile.lock
        
        # Remove explicit Firebase pods from Podfile (FlutterFire will manage)
        sed -i '' "/pod 'Firebase\/Core'/d" Podfile
        sed -i '' "/pod 'Firebase\/Messaging'/d" Podfile
        
        # Install pods with repo update
        pod install --repo-update
    
    - name: Build iOS Simulator
      working-directory: ./app
      run: |
        flutter build ios --debug --simulator --no-codesign
        
        # Verify
        ls -la build/ios/iphonesimulator/Runner.app || exit 1
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        rm -f Runner.zip
        ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.zip
        unzip -l Runner.zip | head -10
        ls -lh Runner.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5