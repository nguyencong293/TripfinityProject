name: Build iOS Simulator App

on:
  workflow_dispatch:  # Chạy thủ công
  push:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  build-ios:
    # Vẫn dùng macos-latest (Apple Silicon) để build cho nhanh
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # Nên dùng stable cho ổn định
        cache: true
    
    - name: Get dependencies
      working-directory: ./app
      run: flutter pub get
    
    - name: Build iOS Simulator App (x86_64 compatible)
      working-directory: ./app
      run: |
        # QUAN TRỌNG: Thêm --arch=x86_64
        # Điều này ép Flutter build bản simulator chuẩn Intel.
        # Appetize.io tương thích tốt nhất với chuẩn này (tránh lỗi màn hình đen hoặc không chạy).
        flutter build ios --debug --simulator --no-codesign --arch=x86_64
    
    - name: Create ZIP for Appetize
      working-directory: ./app/build/ios/iphonesimulator
      run: |
        # Xóa zip cũ nếu có
        rm -f Runner.zip
        
        # Dùng lệnh zip chuẩn thay vì ditto
        # -r: Nén đệ quy thư mục Runner.app
        # -y: Giữ nguyên các symbolic links (quan trọng cho macOS app)
        zip -r -y Runner.zip Runner.app
        
        # Kiểm tra nhanh cấu trúc file zip sau khi nén
        # Nếu đúng chuẩn, bạn sẽ thấy dòng đầu tiên là "Runner.app/"
        echo "=== Checking ZIP Structure ==="
        unzip -l Runner.zip | head -n 10
    
    - name: Upload iOS Simulator App
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: app/build/ios/iphonesimulator/Runner.zip
        retention-days: 5